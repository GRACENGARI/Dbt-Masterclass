version: 2

models:
  - name: stg_raw__users
    description: One row per user. Light renaming/cleanup only, no joins.
    columns:
      - name: user_id
        description: primary key for my staging users table
        data_tests:
          - unique
          - not_null

      - name: traffic_source
        description: >
          Acquisition channel at signup.

      - name: created_at

  - name: stg_raw__orders
    description: The orders table
    columns:
      - name: order_id
        description: Primary key
        data_tests:
          - not_null
          - unique

      - name: user_id
        description: foreign key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw__users')
                field: user_id

      - name: order_status
        description: The unique order status in my orders table.
        data_tests:
          - accepted_values:
              arguments:
                values: ['cancelled', 'complete', 'processing', 'returned', 'shipped']

  - name: stg_raw__order_items
    description: Order line items - the grain most revenue queries should join from.
    columns:
      - name: order_item_id
        description: Primary key.
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw__orders')
                field: order_id

      - name: product_id
        description: foreign key
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_raw__products')
                field: product_id

      - name: order_status
        description: The unique order status in my orders table.
        data_tests:
          - accepted_values:
              arguments:
                values: ['cancelled', 'complete', 'processing', 'returned', 'shipped']

      - name: sale_price
        description: Sales price of order items sold by the seller
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: created_at
        description: When the order items was created
