version: 2

sources:
  - name: thelook_commerce
    database: bigquery-public-data
    schema: thelook_ecommerce
    description: "Synthetic e-commerce dataset on BigQuery"

    tables:
      - name: users
        description: "One row per customer"

      - name: orders
        description: "One row per order"
        config:
          loaded_at_field: created_at
          freshness:
            warn_after:
              count: 7
              period: day
            error_after:
              count: 30
              period: day

      - name: order_items
        description: "One row per order line item"

      - name: products
        description: "One row per product"

      - name: distribution_centers
        description: "One row per distribution center"

      - name: inventory_items
        description: "One row per inventory item"





